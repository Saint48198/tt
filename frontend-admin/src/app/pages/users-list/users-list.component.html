<div class="users-list-page">
  <div class="page-header">
    <h1>Users</h1>
    <div class="header-actions">
      <mat-slide-toggle
        [checked]="includeDisabled()"
        (change)="onToggleDisabled($event.checked)"
        color="primary">
        Show Disabled
      </mat-slide-toggle>
      <button mat-raised-button color="primary" routerLink="/users/new">
        <mat-icon>add</mat-icon>
        Add User
      </button>
    </div>
  </div>

  <div class="table-container mat-elevation-z2">
    @if (loading()) {
      <div class="loading-overlay">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    }

    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)">
      <!-- Username Column -->
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Username</th>
        <td mat-cell *matCellDef="let user">{{ user.username }}</td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <!-- Roles Column -->
      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Roles</th>
        <td mat-cell *matCellDef="let user">
          @if (getRolesArray(user.roles).length > 0) {
            <div class="roles-container">
              @for (role of getRolesArray(user.roles); track role) {
                <mat-chip>{{ role }}</mat-chip>
              }
            </div>
          } @else {
            <span class="no-roles">-</span>
          }
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button [routerLink]="['/users', user.id]" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteUser(user)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.disabled-row]="row.disabled_date"></tr>

      <!-- No Data Row -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state" [attr.colspan]="displayedColumns.length">
          @if (!loading()) {
            No users found.
          }
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="total()"
      [pageSize]="25"
      [pageSizeOptions]="[10, 25, 50, 100]"
      (page)="onPageChange($event)"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
