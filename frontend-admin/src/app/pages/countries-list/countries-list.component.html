<div class="countries-list-page">
  <div class="page-header">
    <h1>Countries</h1>
    <button mat-raised-button color="primary" routerLink="/countries/new">
      <mat-icon>add</mat-icon>
      Add Country
    </button>
  </div>

  <div class="table-container mat-elevation-z2">
    @if (loading()) {
      <div class="loading-overlay">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    }

    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let country">{{ country.name }}</td>
      </ng-container>

      <!-- Abbreviation Column -->
      <ng-container matColumnDef="abbreviation">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Abbreviation</th>
        <td mat-cell *matCellDef="let country">{{ country.abbreviation || '-' }}</td>
      </ng-container>

      <!-- Latitude Column -->
      <ng-container matColumnDef="lat">
        <th mat-header-cell *matHeaderCellDef>Latitude</th>
        <td mat-cell *matCellDef="let country">{{ country.lat || '-' }}</td>
      </ng-container>

      <!-- Longitude Column -->
      <ng-container matColumnDef="lng">
        <th mat-header-cell *matHeaderCellDef>Longitude</th>
        <td mat-cell *matCellDef="let country">{{ country.lng || '-' }}</td>
      </ng-container>

      <!-- Last Visited Column -->
      <ng-container matColumnDef="last_visited">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Visited</th>
        <td mat-cell *matCellDef="let country">{{ country.last_visited || 'Never' }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let country">
          <button mat-icon-button [routerLink]="['/countries', country.id]" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteCountry(country)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- No Data Row -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state" [attr.colspan]="displayedColumns.length">
          @if (!loading()) {
            No countries found.
          }
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="total()"
      [pageSize]="25"
      [pageSizeOptions]="[10, 25, 50, 100]"
      (page)="onPageChange($event)"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
