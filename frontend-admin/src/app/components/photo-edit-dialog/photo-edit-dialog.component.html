<div class="photo-edit-dialog">
  <h2 mat-dialog-title>
    <mat-icon class="dialog-title-icon">edit</mat-icon>
    Edit Photo
  </h2>

  <mat-dialog-content>
    <div class="dialog-layout">
      <!-- Photo preview -->
      <div class="photo-preview">
        <img [src]="photo.url" [alt]="caption || 'Photo'" class="preview-image">
        <div class="source-badges">
          @if (photo.in_database) {
            <span class="badge badge-db">
              <mat-icon class="badge-icon">storage</mat-icon>
              Database
            </span>
          }
          @if (photo.in_cloudinary) {
            <span class="badge badge-cloud">
              <mat-icon class="badge-icon">cloud</mat-icon>
              Cloudinary
            </span>
          }
        </div>
      </div>

      <!-- Edit form -->
      <div class="edit-form">
        <mat-tab-group animationDuration="200ms">
          <!-- Details Tab -->
          <mat-tab>
            <ng-template mat-tab-label>
              <mat-icon class="tab-icon">info</mat-icon>
              Details
            </ng-template>
            <app-details-tab [(caption)]="caption" [(tags)]="tags" />
          </mat-tab>

          <!-- Entity Tab -->
          <mat-tab>
            <ng-template mat-tab-label>
              <mat-icon class="tab-icon">link</mat-icon>
              Entity
            </ng-template>
            <app-entity-tab
              [(cityId)]="cityId"
              [(attractionId)]="attractionId"
              [countryId]="photo.country_id"
              [initialCityName]="photo.city_name || ''"
              [initialAttractionName]="photo.attraction_name || ''" />
          </mat-tab>

          <!-- Location Tab -->
          <mat-tab>
            <ng-template mat-tab-label>
              <mat-icon class="tab-icon">location_on</mat-icon>
              Location
            </ng-template>
            <app-location-tab
              [latitude]="latitude"
              [longitude]="longitude"
              [caption]="caption"
              [currentCityId]="cityId"
              (citySelected)="onCitySelectedFromLocation($event)" />
          </mat-tab>

          <!-- Info Tab -->
          <mat-tab>
            <ng-template mat-tab-label>
              <mat-icon class="tab-icon">info_outline</mat-icon>
              Info
            </ng-template>
            <app-info-tab [photo]="photo" />
          </mat-tab>
        </mat-tab-group>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" (click)="save()" [disabled]="saving()">
      @if (saving()) {
        <mat-spinner diameter="20" class="btn-spinner"></mat-spinner>
      } @else {
        <span class="btn-content">
          <mat-icon>save</mat-icon>
          Save Changes
        </span>
      }
    </button>
  </mat-dialog-actions>
</div>
