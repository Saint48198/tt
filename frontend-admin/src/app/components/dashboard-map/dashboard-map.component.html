<div class="dashboard-map-widget">
  <div class="widget-header">
    <h3>{{ title }}</h3>
    <span class="widget-badge">{{ markers.length }} locations</span>
  </div>

  <lib-map
    [markers]="markers"
    [center]="[20, 0]"
    [zoom]="2"
    [height]="mapHeight"
    [fitBounds]="false"
    [showAttribution]="true">
  </lib-map>

  @if (showLegend) {
    <div class="map-legend">
      <div class="legend-item">
        <span class="marker">📍</span>
        <span>Popular Destination</span>
      </div>
    </div>
  }
</div>
