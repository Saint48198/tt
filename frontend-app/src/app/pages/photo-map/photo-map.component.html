<div class="photo-map-page">
  @if (loading()) {
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
      <span>Loading photos...</span>
    </div>
  } @else if (error()) {
    <div class="error-overlay">
      <span class="error-icon">😕</span>
      <h2>{{ error() }}</h2>
      <p>Unable to load photo locations.</p>
      <a class="back-link" (click)="goBack()">← Back to Explore</a>
    </div>
  } @else {
    <div class="map-banner">
      <a class="banner-back" (click)="goBack()">← Explore</a>
      <h2>
        <svg
          class="banner-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <polyline points="21 15 16 10 5 21" />
        </svg>
        {{ title() }}
      </h2>
      @if (availableYears().length > 1) {
        <select
          class="year-filter"
          [value]="selectedYear() ?? ''"
          (change)="
            onYearChange($any($event.target).value === '' ? null : +$any($event.target).value)
          "
        >
          <option value="">All Years</option>
          @for (year of availableYears(); track year) {
            <option [value]="year">{{ year }}</option>
          }
        </select>
      }
      <span class="photo-count">{{ photos().length }} photos</span>
    </div>
    <lib-map
      [markers]="markers()"
      [center]="[20, 0]"
      [zoom]="3"
      height="100%"
      width="100%"
      [fitBounds]="hasMarkers()"
      [enableZoom]="true"
      [enableDrag]="true"
      [enableClustering]="true"
      [showAttribution]="true"
    >
    </lib-map>

    <lib-lightbox
      [photos]="lightboxPhotos()"
      [open]="lightboxOpen()"
      [currentIndex]="lightboxIndex()"
      (closed)="onLightboxClose()"
      (indexChange)="lightboxIndex.set($event)"
    ></lib-lightbox>
  }
</div>
