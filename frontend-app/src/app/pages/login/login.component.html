<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="40" height="40">
        <circle cx="16" cy="16" r="16" fill="#667eea"/>
        <path d="M16 6a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="#fff"/>
      </svg>
      <h1>Trip Tracker</h1>
      <p class="subtitle">Sign in to your account</p>
    </div>

    @if (errorMessage(); as msg) {
      <div class="error-message">{{ msg }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          placeholder="Enter your username"
          autocomplete="username"
        />
        @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
          <span class="field-error">Username is required</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <span class="field-error">Password is required</span>
        }
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading()" class="login-button">
        @if (isLoading()) {
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
    </form>
  </div>
</div>
