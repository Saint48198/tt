<div class="landing-map">
  @if (loading()) {
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
    </div>
  }
  @if (username() && hasData()) {
    <div class="profile-banner">
      <h2>🌍 {{ username() }}'s Travel Map</h2>
      <span class="country-count">{{ countries().length }} countries visited</span>
    </div>
  }
  <lib-map
    [markers]="mapMarkers"
    [overlays]="mapOverlays"
    [center]="mapCenter"
    [zoom]="mapZoom"
    height="100%"
    width="100%"
    [fitBounds]="false"
    [enableZoom]="true"
    [enableDrag]="true"
    [showAttribution]="true">
  </lib-map>
</div>
